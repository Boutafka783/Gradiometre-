name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate project from setup.py
        run: python3 setup.py .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        shell: bash
        run: gradle assembleDebug --console=plain 2>&1 | tee build.log

      - name: Error summary
        if: failure()
        shell: bash
        run: |
          grep -n -A15 "What went wrong" build.log | head -40 || true
          grep -n "^e: " build.log | head -30 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-output
          path: |
            build.log
            app/build/outputs/apk/debug/*.apk
