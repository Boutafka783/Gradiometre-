name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate project from setup.py
        run: python3 setup.py .

      - name: Setup App Icon
        shell: bash
        run: |
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          if [ -f "icon.png" ]; then
            cp icon.png app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp icon.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            cp icon.png app/src/main/res/mipmap-hdpi/ic_launcher_round.png
            cp icon.png app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
            echo "تم تعيين الأيقونة بنجاح"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --console=plain 2>&1 | tee build.log

      - name: Error summary
        if: failure()
        shell: bash
        run: |
          echo "=== Kotlin errors (file:line) ==="
          grep -n "^e: " build.log | head -30 || true
          echo "=== What went wrong ==="
          grep -n -A15 "What went wrong" build.log | head -40 || true

      - name: Upload APK and Logs Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gradiometer-debug-apk
          path: |
            build.log
            app/build/outputs/apk/debug/*.apk


