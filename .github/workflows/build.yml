name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate project from setup.py
        run: python3 setup.py .
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}

      - name: Setup App Icon
        shell: bash
        run: |
          if [ -f "IMG_20261101_171214_(520_x_520_pixel).jpg" ]; then
            echo "تم العثور على صورة الأيقونة وجاهزة للتوزيع"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # AGP 8.7.3 يحتاج Gradle 8.9 أو أحدث
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Create google-services.json
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi

      - name: Build Release APK
        shell: bash
        env:
          VIDEO_SERVER_URL: ${{ secrets.VIDEO_SERVER_URL }}
          REMOTE_CONFIG_URL: ${{ secrets.REMOTE_CONFIG_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: |
          set -o pipefail
          gradle assembleRelease --stacktrace --console=plain 2>&1 | tee build.log

      - name: Error summary
        if: failure()
        shell: bash
        run: |
          echo "=== Kotlin errors (file:line) ==="
          grep -n "^e: " build.log | head -40 || true
          echo "=== What went wrong ==="
          grep -n -A15 "What went wrong" build.log | head -40 || true

      - name: Upload APK and Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradiometer-release-apk
          path: |
            build.log
            app/build/outputs/apk/release/*.apk



